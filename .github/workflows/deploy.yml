name: Deploy

# GitOps: every push to main deploys. `workflow_dispatch` stays for manual re-runs.
# Requires the Azure vars/secrets from `azd pipeline config` + the SWA token (see DEPLOYMENT.md).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login to Azure
  contents: read

# Serialized, and not cancel-in-progress. This job migrates a database and opens a firewall window
# it closes in an always() step, so two overlapping runs would have run A's cleanup sever run B
# mid-migration. Cancelling instead of queueing would do the same to whichever run was interrupted.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ---- API → Azure Container Apps (via azd) -------------------------------------------------
  deploy-backend:
    name: Deploy API (Azure Container Apps)
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      # azd reads infra parameters from these env vars (config store is empty in CI);
      # they map to infra.parameters.frontend_origin / .google_client_id in the AppHost.
      AZURE_FRONTEND_ORIGIN: ${{ vars.AZURE_FRONTEND_ORIGIN }}
      AZURE_GOOGLE_CLIENT_ID: ${{ vars.AZURE_GOOGLE_CLIENT_ID }}
      # Postgres admin credentials. The AppHost now builds the connection string from these
      # (infra.parameters.postgres_username / .postgres_password), so azd requires them as
      # provision inputs. Values come from the repo var/secret set by `azd pipeline config`.
      AZURE_POSTGRES_USERNAME: ${{ vars.AZURE_POSTGRES_USERNAME }}
      AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
      # The least-privilege application role's password (infra.parameters.postgres_app_password).
      # One secret feeds two consumers that must agree: azd bakes it into the container's connection
      # string, and the provisioning step below assigns it to the role. Splitting them is how the
      # deployed app ends up unable to log in.
      AZURE_POSTGRES_APP_PASSWORD: ${{ secrets.AZURE_POSTGRES_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # An unset secret resolves to the empty string rather than failing, and both consumers would
      # take it: azd would provision a container whose connection string has no password, and the
      # provisioning tool would try to assign an empty one. Named failure here beats either.
      - name: Require the application role password
        run: |
          if [ -z "$AZURE_POSTGRES_APP_PASSWORD" ]; then
            echo "AZURE_POSTGRES_APP_PASSWORD is empty. Set the repository secret; it is the" >&2
            echo "password azd bakes into the container connection string AND the one the" >&2
            echo "provisioning step assigns to the budgetoid_app role. See DEPLOYMENT.md." >&2
            exit 1
          fi

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to azd (federated)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"

      - name: Log in to Azure CLI (federated)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure
        run: azd provision --no-prompt

      # The database work sits between provision and deploy on purpose: new application code must
      # never start against an old schema. Azure Postgres accepts no external connection without a
      # firewall rule, so the runner opens a window for its own IP only and closes it below. A
      # permanent "allow Azure services" rule would be the easy alternative and is worse — it admits
      # every Azure tenant's egress forever, where this admits one address for a couple of minutes.
      - name: Open a database firewall window for this runner
        id: dbfw
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org || curl -sf https://ifconfig.me/ip)
          if [ -z "$RUNNER_IP" ]; then echo "Could not determine the runner's public IP." >&2; exit 1; fi
          SERVER=$(az postgres flexible-server list -g "$AZURE_RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          # A fixed rule name makes create an upsert, so a rule stranded by a killed runner is
          # overwritten here and removed by this run's cleanup — the hole self-heals on next deploy.
          az postgres flexible-server firewall-rule create \
            -g "$AZURE_RESOURCE_GROUP" -n "$SERVER" --rule-name gh-deploy-migration \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      # Migrate, provision the role, and verify row-level security coverage in one process, so the
      # ordering is enforced in code rather than by whoever reads the runbook. The grants are
      # fail-closed, but RLS is fail-open: a migrated table with no policy is readable across every
      # tenant and reports nothing, which is why the tool verifies rather than assumes.
      - name: Migrate schema and provision the application role
        timeout-minutes: 15
        env:
          DBPROVISION_APP_ROLE_PASSWORD: ${{ secrets.AZURE_POSTGRES_APP_PASSWORD }}
        run: |
          VAULT=$(az keyvault list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name,'postgreskv')].name | [0]" -o tsv)
          CONN=$(az keyvault secret show --vault-name "$VAULT" \
            --name connectionstrings--budgetoid --query value -o tsv)
          # Not a secrets.* value, so Actions does not mask it automatically. Mask it before it can
          # reach a log, and keep it in this step's environment only — writing it to GITHUB_ENV would
          # persist an admin credential to a file on the runner for every later step to inherit.
          echo "::add-mask::$CONN"
          # The Key Vault string carries host/user/password/database and no SslMode; Azure Postgres
          # refuses unencrypted connections. Api/Program.cs appends the same option for the same
          # reason.
          DBPROVISION_ADMIN_CONNECTION_STRING="${CONN};Ssl Mode=Require" \
            dotnet run --project BudgetoidApp/Tools/DbProvision -c Release

      # always(), so a failed migration closes the window it opened instead of leaving the database
      # reachable from a retired runner's address.
      - name: Close the database firewall window
        if: always() && steps.dbfw.outputs.server != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            -g "$AZURE_RESOURCE_GROUP" -n "${{ steps.dbfw.outputs.server }}" \
            --rule-name gh-deploy-migration --yes || true

      - name: Deploy API
        run: azd deploy --no-prompt

      # azd's generated Container App bakes in a warm minReplicas of 1. Enforce scale-to-zero
      # (min 0, max 2 per CLAUDE.md) so the consumption-tier API costs ~nothing at rest, trading a
      # cold start on the first request after idle. This can't be set from the AppHost without
      # Aspire taking ownership of the Container Apps environment (limited mode) — which would
      # regenerate the environment and change the public API URL. So enforce it here instead.
      - name: Enforce scale-to-zero on the Container App
        run: az containerapp update -n api -g "$AZURE_RESOURCE_GROUP" --min-replicas 0 --max-replicas 2

  # ---- Frontend → Azure Static Web Apps -----------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Azure Static Web Apps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClientApp/angular-budgetoid/package-lock.json

      - name: Install dependencies
        working-directory: ClientApp/angular-budgetoid
        run: npm ci

      - name: Test
        working-directory: ClientApp/angular-budgetoid
        run: npm test

      - name: Build
        working-directory: ClientApp/angular-budgetoid
        run: npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # We build with `npm run build` above, so skip Oryx and upload the built
          # output directly. With skip_app_build, the action reads app_location as-is
          # and ignores output_location — so point it straight at the browser dist.
          app_location: ClientApp/angular-budgetoid/dist/angular-budgetoid/browser
          skip_app_build: true
