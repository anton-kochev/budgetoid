name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Applied migrations are frozen: production's __EFMigrationsHistory references their ids and the
  # deploy pipeline migrates unattended on every push to main, so an edited migration re-runs
  # against a populated database and a regenerated baseline (new id) makes the next push try to
  # re-create every table. Only additions are allowed; the model snapshot is exempt because EF
  # rewrites it on every `migrations add`.
  #
  # REBASELINE_WINDOW suspends that rule, and is the recorded exception rather than a switch to
  # flip in passing. It is open because the production database holds no data, so the schema
  # changes still ahead can collapse into one regenerated baseline instead of a chain of
  # migrations no database ever replays step by step. Whoever regenerates the baseline resets
  # production's history in the same deploy or the deploy fails. Closing the window is one word
  # here plus FROZEN_FROM set to the new baseline id; docs/engineering/migrations.md carries the
  # reasoning and DEPLOYMENT.md the reset procedure.
  migrations-guard:
    name: Migrations only grow
    runs-on: ubuntu-latest

    env:
      # The id from which the freeze applies. Earlier ids are prehistory, removed when the
      # baseline was frozen.
      FROZEN_FROM: '20260728195844'
      # 'open' suspends the freeze; any other value enforces it.
      REBASELINE_WINDOW: open

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail when an existing migration changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch push; no base to diff against — skipping."
              exit 0
            fi
          fi

          # Police migration ids from FROZEN_FROM onward — earlier ids are prehistory removed
          # when the baseline was frozen, and the model snapshot (no timestamp prefix) is
          # rewritten by every `migrations add`. A rename line carries two paths, so every path
          # field is checked.
          violations="$(
            git diff --name-status --find-renames "$base" HEAD -- \
              'BudgetoidApp/Infrastructure/Persistence/Migrations/*.cs' \
            | grep -Ev '^A\b' \
            | awk -F'\t' -v frozen="$FROZEN_FROM" '{
                for (i = 2; i <= NF; i++) {
                  n = split($i, parts, "/"); f = parts[n];
                  if (f ~ /^[0-9]{14}_/ && substr(f, 1, 14) >= frozen) { print; next }
                }
              }' \
            || true
          )"

          # The window is announced on every run, so an open one cannot go unnoticed while the
          # database it is safe against fills up.
          if [ "$REBASELINE_WINDOW" = "open" ]; then
            echo "Rebaseline window is OPEN — the migration freeze is suspended."
            if [ -n "$violations" ]; then
              echo "Permitted changes to existing migrations:"
              echo "$violations"
            fi
            echo "Close it in this job (REBASELINE_WINDOW + FROZEN_FROM) once the schema settles."
            exit 0
          fi

          if [ -n "$violations" ]; then
            echo "Existing migration files were modified, deleted, or renamed:"
            echo "$violations"
            echo
            echo "Applied migrations are frozen (docs/engineering/migrations.md, ADR 0006):"
            echo "the deploy pipeline applies migrations unattended, so an edited migration"
            echo "re-runs against the populated production database and a regenerated"
            echo "baseline re-creates every table. Add a new migration instead of changing"
            echo "an existing one."
            exit 1
          fi

          echo "Migrations directory only grew."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BudgetoidApp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            BudgetoidApp/**/*.csproj
            BudgetoidApp/**/packages.lock.json

      - name: Restore
        run: dotnet restore BudgetoidApp.sln

      - name: Build
        run: dotnet build BudgetoidApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BudgetoidApp.sln --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp/angular-budgetoid

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClientApp/angular-budgetoid/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
