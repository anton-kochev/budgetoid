<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Budgetoid</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Applies a saved theme before first paint; the argument for why it is a file
         rather than an inline script is in public/theme-prepaint.js. -->
    <script src="/theme-prepaint.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Typefaces are served from this origin (public/fonts). The @font-face rules live
         in assets/theming/_fonts.scss; Inter blocks first paint, so it is preloaded
         rather than waiting on the stylesheet. `crossorigin` is required on a font
         preload even same-origin. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/inter-latin-wght-normal.woff2"
    />
  </head>

  <body class="mat-typography">
    <app-root class="budgetoid-app"></app-root>
  </body>
</html>
