<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Budgetoid</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Apply a saved theme before first paint to avoid a flash of the wrong mode.
         ThemeService remains the runtime authority; this only pre-paints. -->
    <script>
      try {
        const m = localStorage.getItem('budgetoid-theme');
        if (m === 'light' || m === 'dark') {
          document.documentElement.style.colorScheme = m;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mohave:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body class="mat-typography">
    <app-root class="budgetoid-app"></app-root>
  </body>
</html>
